# Continuous integration (docs/PACKAGING.md#continuous-integration, docs/TESTING.md).
# Everything runs headless: no window is shown and no input is sent.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type check, unit tests, build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (electron-vite)
        run: npm run build

  engine-tests:
    name: Engine tests (headless LibreOffice)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only the extracted engine image is cached (about 1.5 GB). A new lock file means a new key, so an
      # engine update is always downloaded and verified again.
      - name: Restore the engine image
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: vendor/libreoffice
          key: engine-${{ runner.os }}-${{ hashFiles('scripts/engine/engine.lock.json') }}

      - name: Fetch, verify and extract the engine (cache miss)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/engine/fetch-engine.ps1 -RemoveMsiAfterExtract

      - name: Engine tests
        shell: pwsh
        run: |
          # Electron-based editors export ELECTRON_RUN_AS_NODE; make sure it never reaches the tests.
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npm run test:engine

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/
          if-no-files-found: ignore
          retention-days: 14
